name: mobile_engine
description: "High-performance configurable Web2App Mobile Runtime Engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  google_mobile_ads: ^5.2.0
  onesignal_flutter: ^5.3.3
  permission_handler: ^11.4.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  image: ^4.5.4
  local_auth: ^2.3.0
  in_app_review: ^2.0.9
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/app_config.json
    - assets/rules/adblock_rules.json
