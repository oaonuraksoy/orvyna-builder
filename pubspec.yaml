name: orvyna_engine
description: "High-performance Orvyna Mobile Runtime Engine for Web-to-Native Apps"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  google_mobile_ads: ^9.2.0
  onesignal_flutter: ^5.3.3
  permission_handler: ^13.0.2
  url_launcher: ^6.3.1
  connectivity_plus: ^7.3.2
  shimmer: ^4.0.0
  flutter_svg: ^2.0.17
  image: ^4.5.4
  local_auth: ^3.0.2
  in_app_review: ^2.0.9
  device_info_plus: ^13.3.0
  share_plus: ^13.3.1
  app_badge_plus: ^1.3.5
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/app_config.json
    - assets/rules/adblock_rules.json
