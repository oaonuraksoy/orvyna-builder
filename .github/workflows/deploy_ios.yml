name: iOS Build & TestFlight Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Dağıtım Hedefi'
        required: true
        default: 'testflight'
        type: choice
        options:
          - 'testflight'
          - 'ipa_archive_only'
      app_config_json:
        description: 'Özel app_config.json içeriği (Opsiyonel JSON string)'
        required: false
        type: string

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enjekte Edilmiş app_config.json Uygula
        if: "${{ github.event.inputs.app_config_json != '' }}"
        run: |
          echo '${{ github.event.inputs.app_config_json }}' > assets/config/app_config.json

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS IPA (No Codesign for Archive)
        if: "${{ github.event.inputs.deploy_target == 'ipa_archive_only' }}"
        run: flutter build ios --release --no-codesign

      - name: Build and Deploy to TestFlight via Fastlane
        if: "${{ github.event.inputs.deploy_target == 'testflight' }}"
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_CERTIFICATE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASS }}
        working-directory: ./ios
        run: |
          if [ -f "Fastfile" ] || [ -f "fastlane/Fastfile" ]; then
            bundle exec fastlane beta
          else
            echo "Fastfile mevcut değil, standart flutter build ipa çalıştırılıyor..."
            cd ..
            flutter build ipa --release --no-codesign
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-archive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: ignore
