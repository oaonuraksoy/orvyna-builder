name: iOS Build & App Store Connect

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Hedef (testflight = imzala ve App Store Connect''e yükle, verify = imzasız derleme testi)'
        required: true
        default: 'testflight'
        type: choice
        options: ['testflight', 'verify']
      app_version:
        description: 'Sürüm adı (örn: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      build_number:
        description: 'Derleme numarası'
        required: true
        default: '1'
        type: string
      engine_ref:
        description: 'Orvyna motor sürümü'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_VERSION: ${{ inputs.app_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      ENGINE_REF: ${{ inputs.engine_ref }}

    steps:
      - name: Girdileri doğrula
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::Geçersiz sürüm adı"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Geçersiz derleme numarası"; exit 1; }
          [[ "$ENGINE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Geçersiz motor sürümü"; exit 1; }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Kullanıcı ayarlarını koru ve motoru güncelle
        run: |
          cp assets/config/app_config.json "$RUNNER_TEMP/app_config.json"
          git fetch --depth=1 https://github.com/oaonuraksoy/orvyna-builder.git "$ENGINE_REF"
          git checkout FETCH_HEAD -- .
          cp "$RUNNER_TEMP/app_config.json" assets/config/app_config.json

      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Yapılandırmayı uygula
        run: dart tool/apply_app_config.dart --platform=ios

      - name: Flutter derlemesi (imzasız)
        run: flutter build ios --release --no-codesign --no-pub --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"

      - name: İmzala ve App Store Connect'e yükle
        if: inputs.deploy_target == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::$v eksik. Studio'da 5. adımdan Apple bilgilerini tanımlayın."; exit 1; }
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          trap 'rm -f "$KEY_PATH"' EXIT
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa "${AUTH[@]}"
