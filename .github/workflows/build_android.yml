name: Android Build & Google Play
run-name: Build ${{ inputs.project_id }}

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Şifreli proje kimliği'
        required: false
        default: ''
        type: string
      build_type:
        description: 'Derleme türü'
        required: true
        default: 'aab'
        type: choice
        options: ['apk', 'aab']
      app_version:
        description: 'Sürüm adı (örn: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      build_number:
        description: 'Derleme numarası'
        required: true
        default: '1'
        type: string
      play_track:
        description: 'Google Play kanalı (none = yalnızca derle)'
        required: true
        default: 'none'
        type: choice
        options: ['none', 'internal', 'alpha', 'beta', 'production']
      engine_ref:
        description: 'Orvyna motor sürümü'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.project_id }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      APP_VERSION: ${{ inputs.app_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      ENGINE_REF: ${{ inputs.engine_ref }}
      BUILD_TYPE: ${{ inputs.build_type }}

    steps:
      - name: Girdileri doğrula
        run: |
          [[ -z "$PROJECT_ID" || "$PROJECT_ID" =~ ^[a-f0-9]{16}$ ]] || { echo "::error::Geçersiz proje kimliği"; exit 1; }
          [[ "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]] || { echo "::error::Geçersiz sürüm adı"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Geçersiz derleme numarası"; exit 1; }
          [[ "$ENGINE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Geçersiz motor sürümü"; exit 1; }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Motoru güncelle
        run: |
          git fetch --depth=1 https://github.com/oaonuraksoy/orvyna-builder.git "$ENGINE_REF"
          git checkout FETCH_HEAD -- .

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Bağımlılıkları yükle
        run: flutter pub get

      - name: Şifreli proje paketini aç
        if: inputs.project_id != ''
        env:
          ORVYNA_PROJECT_KEY: ${{ secrets[format('ORVYNA_KEY_{0}', inputs.project_id)] }}
        run: dart tool/project_bundle.dart open --project="$PROJECT_ID"

      - name: Yapılandırmayı ve imzalamayı uygula
        run: dart tool/apply_app_config.dart --platform=android

      - name: Mağaza yüklemesi için gerçek imzayı zorunlu kıl
        if: inputs.play_track != 'none'
        run: |
          [ -f android/key.properties ] || { echo "::error::Google Play için keystore gerekli."; exit 1; }
          [ -n "${ORVYNA_PLAY_JSON:-}" ] || { echo "::error::Google Play hizmet hesabı anahtarı eksik."; exit 1; }

      - name: Derle
        run: |
          target=appbundle
          [ "$BUILD_TYPE" = "apk" ] && target=apk
          flutter build "$target" --release --no-pub --build-name="$APP_VERSION" --build-number="$BUILD_NUMBER"

      - name: Google Play'e yükle
        if: inputs.play_track != 'none'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJson: ${{ env.ORVYNA_PLAY_JSON }}
          packageName: ${{ env.ORVYNA_PACKAGE }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed

      - name: Paketi şifrele
        if: inputs.play_track == 'none' && inputs.project_id != ''
        env:
          ORVYNA_PROJECT_KEY: ${{ secrets[format('ORVYNA_KEY_{0}', inputs.project_id)] }}
        run: |
          src=build/app/outputs/bundle/release/app-release.aab
          [ "$BUILD_TYPE" = "apk" ] && src=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/sealed
          dart tool/project_bundle.dart seal --in="$src" --out="build/sealed/app-release.$BUILD_TYPE.enc"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.play_track == 'none' && inputs.project_id != ''
        with:
          name: release-${{ inputs.build_type }}
          path: build/sealed/*.enc
          if-no-files-found: error
          retention-days: 3
